version: "3.9"

services:
  neo4j:
    image: neo4j:5-community
    container_name: gst-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/gstrecon2025
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p gstrecon2025 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gst-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=gstrecon2025
      - PORT=8000
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app

  frontend:
    build: ./frontend
    container_name: gst-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
